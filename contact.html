<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portfolio-card">
        <header>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
                <button id="theme-toggle" class="theme-btn">🌙 Dark</button>
            </nav>
            <h1>Get in Touch</h1>
        </header>

        <main>
            <form id="contact-form" action="https://formspree.io/f/xnppdezq" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required />
                </div>

                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required />
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Hi, I'd like to talk about..." required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">Send Message</button>
                <div id="form-status" class="form-status"></div>
            </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
