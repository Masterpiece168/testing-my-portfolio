<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Projects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="portfolio-card">
        <header>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="projects.html" class="active">Projects</a>
                <a href="contact.html">Contact</a>
                <button id="theme-toggle" class="theme-btn">🌙 Dark</button>
            </nav>
            <h1>My Projects</h1>
        </header>

        <main>
            <!-- Search & Filter Controls -->
            <div class="filter-controls">
                <input type="text" id="search-input" placeholder="Search projects..." />
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Networking">Networking</button>
                    <button class="filter-btn" data-category="C++">C++</button>
                    <button class="filter-btn" data-category="Web">Web</button>
                </div>
            </div>

            <!-- Dynamic Projects Container -->
            <div id="projects-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
